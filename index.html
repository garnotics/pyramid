<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คำนวณเลขศาสตร์พีระมิด</title>

<style>
body{
    background:#000;
    color:white;
    text-align:center;
    font-family:sans-serif;
}

input{
    font-size:40px;
    width:80%;
    padding:10px;
    text-align:center;
}

.row{
    font-size:50px;
    margin:10px;
    letter-spacing:10px;
}
</style>
</head>
<body>

<h1>คำนวณเลขศาสตร์พีระมิด</h1>

<input
    id="phone"
    placeholder="กรอกตัวเลขใด ๆ ก็ตาม"
    oninput="calculate()">

<div id="result"></div>

<script>

function reduce(num){
    if(num < 10) return num;

    let sum = 0;

    while(num > 0){
        sum += num % 10;
        num = Math.floor(num / 10);
    }

    return sum;
}

function calculate(){

    let value =
        document.getElementById("phone")
        .value
        .replace(/\D/g,'');

    let resultDiv =
        document.getElementById("result");

    resultDiv.innerHTML = "";

    let current =
        value.split('').map(Number);

    while(current.length > 0){

        let row =
            document.createElement("div");

        row.className = "row";

        row.textContent =
            current.join(' ');

        resultDiv.appendChild(row);

        if(current.length === 1)
            break;

        let next = [];

        for(let i=0;i<current.length-1;i++){

            next.push(
                reduce(
                    current[i] +
                    current[i+1]
                )
            );
        }

        current = next;
    }
}

</script>

</body>
</html>
