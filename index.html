<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คำนวณเลขศาสตร์พีระมิด</title>

<style>
body {
    background: #000;
    color: white;
    text-align: center;
    font-family: sans-serif;
    margin: 0;
    padding: 10px;
    box-sizing: border-box;
}

h1 {
    font-size: 1.8rem;
    margin-top: 20px;
}

input {
    font-size: 24px;
    width: 90%;      
    max-width: 400px; /* 🎯 บังคับช่องกรอกในคอมไม่ให้ยาวเกินไป */
    padding: 12px;
    text-align: center;
    border-radius: 8px;
    border: none;
    box-sizing: border-box;
}

#result {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.row {
    font-size: 5vw;        /* ขนาดออโต้สำหรับมือถือ */
    margin: 4px 0;         
    letter-spacing: 0.3em; 
    white-space: nowrap;   
    padding-left: 0.3em;   
}

/* 💻 โค้ดสำหรับหน้าจอคอมพิวเตอร์ (หน้าจอที่กว้างกว่า 600px ขึ้นไป) */
@media (min-width: 600px) {
    .row {
        font-size: 32px; /* 🎯 บังคับให้ขนาดตัวเลขในคอมหยุดใหญ่ขึ้น ล็อกไว้ที่ 32px พอดีสายตา */
        margin: 8px 0;   /* เพิ่มระยะห่างแนวตั้งในคอมเล็กน้อยให้ดูสบายตา */
    }
}
</style>

</head>
<body>

<h1>คำนวณเลขศาสตร์พีระมิด</h1>

<input
    id="phone"
    placeholder="กรอกตัวเลขใด ๆ ก็ตาม"
    oninput="calculate()">

<div id="result"></div>

<script>

function reduce(num){
    if(num < 10) return num;

    let sum = 0;

    while(num > 0){
        sum += num % 10;
        num = Math.floor(num / 10);
    }

    return sum;
}

function calculate(){

    let value =
        document.getElementById("phone")
        .value
        .replace(/\D/g,'');

    let resultDiv =
        document.getElementById("result");

    resultDiv.innerHTML = "";

    let current =
        value.split('').map(Number);

    while(current.length > 0){

        let row =
            document.createElement("div");

        row.className = "row";

        row.textContent =
            current.join(' ');

        resultDiv.appendChild(row);

        if(current.length === 1)
            break;

        let next = [];

        for(let i=0;i<current.length-1;i++){

            next.push(
                reduce(
                    current[i] +
                    current[i+1]
                )
            );
        }

        current = next;
    }
}

</script>

</body>
</html>
