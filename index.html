<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คำนวณเลขศาสตร์พีระมิด</title>

<style>
body {
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; /* 🎯 ใช้ฟอนต์โมเดิร์นแบบระบบมือถือ */
    margin: 0;
    padding: 24px 20px; /* ระยะห่างรอบตัวเว็บให้ดูสบายตา */
    box-sizing: border-box;
}

h1 {
    font-size: 1.5rem; /* ขนาดหัวข้อกำลังดี ไม่ใหญ่จนเกินไป */
    font-weight: 600;
    text-align: left;
    margin-top: 0;
    margin-bottom: 8px; /* เว้นช่องไฟให้ติดกับช่องกรอก */
    color: #ffffff;
}

input {
    font-size: 26px; /* ตัวเลขตอนพิมพ์ดูคมชัด */
    width: 100%;      
    max-width: 500px; 
    padding: 14px 16px;
    text-align: left;  
    background-color: #1c1c1e; /* 🖤 เปลี่ยนช่องกรอกเป็นสีเทาเข้ม (Dark Mode สไตล์ Apple) */
    color: #ffffff;
    border-radius: 10px;       /* ขอบมนโค้งมนสวยงาม */
    border: 1px solid #2c2c2e; /* เส้นขอบบางๆ เพิ่มมิติ */
    box-sizing: border-box;
    display: block;    
    margin-bottom: 35px;       /* ทิ้งระยะห่างอย่างเหมาะสมก่อนเริ่มพีระมิด */
    outline: none;
}

input::placeholder {
    color: #8e8e93; /* สีของข้อความแนะนําตอนยังไม่กรอกให้ดูซอฟต์ลง */
}

#result {
    display: flex;
    flex-direction: column;
    align-items: center; /* จัดให้พีระมิดเรียงเป็นทรงสามเหลี่ยมอยู่ตรงกลางเสมอ */
}

.row {
    font-size: 4.6vw;        /* ขนาดตัวเลขปรับอัตโนมัติตามหน้าจอมือถือ */
    font-weight: 400;
    color: #f2f2f7;          /* สีขาวนวล สบายตา */
    margin: 2px 0;           /* ระยะห่างแต่ละชั้นของพีระมิด */
    letter-spacing: 0.18em;  /* ระยะห่างระหว่างตัวเลขที่พอดี ไม่ชิดและไม่ห่างเกินไป */
    white-space: nowrap;   
    padding-left: 0.18em;    
}

/* 💻 ปรับแต่งสำหรับหน้าจอคอมพิวเตอร์ */
@media (min-width: 600px) {
    .row {
        font-size: 28px;    /* ขนาดตัวเลขบนคอมพิวเตอร์ไม่ให้ใหญ่ล้น */
        margin: 6px 0;   
    }
}
</style>

</head>
<body>

<h1>คำนวณเลขศาสตร์พีระมิด</h1>

<input
    id="phone"
    placeholder="กรอกตัวเลขใด ๆ ก็ตาม"
    oninput="calculate()">

<div id="result"></div>

<script>

function reduce(num){
    if(num < 10) return num;

    let sum = 0;

    while(num > 0){
        sum += num % 10;
        num = Math.floor(num / 10);
    }

    return sum;
}

function calculate(){

    let value =
        document.getElementById("phone")
        .value
        .replace(/\D/g,'');

    let resultDiv =
        document.getElementById("result");

    resultDiv.innerHTML = "";

    let current =
        value.split('').map(Number);

    while(current.length > 0){

        let row =
            document.createElement("div");

        row.className = "row";

        row.textContent =
            current.join(' ');

        resultDiv.appendChild(row);

        if(current.length === 1)
            break;

        let next = [];

        for(let i=0;i<current.length-1;i++){

            next.push(
                reduce(
                    current[i] +
                    current[i+1]
                )
            );
        }

        current = next;
    }
}

</script>

</body>
</html>
